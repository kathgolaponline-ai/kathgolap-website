            // Save state updates to LocalStorage
            useEffect(() => { localStorage.setItem('kathgolap_settings', JSON.stringify(settings)); }, [settings]);

            };

            // Direct File Upload for Brand Logo
            const handleLogoFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) {
                        showToast("Logo file must be under 5MB");
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setSettings(prev => ({ ...prev, logoUrl: event.target.result }));
                        setLogoError(false);
                        showToast("Brand logo updated successfully!");
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Direct File Upload for Saree Product Photos
            const handleProductImageUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                files.forEach(file => {
                    if (file.size > 5 * 1024 * 1024) {
                        showToast("Photo must be under 5MB");
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setEditingProduct(prev => {
                            if (!prev) return null;
                            const existingImages = (prev.images || []).filter(img => img.trim() !== "");
                            return { ...prev, images: [...existingImages, event.target.result] };
                        });
                        showToast("Saree photo added!");
                    };
                    reader.readAsDataURL(file);
                });
            };

            const addToCart = (product, quantity = 1) => {
                setCart(prevCart => {
                    const existingIndex = prevCart.findIndex(item => item.product.id === product.id);
                    if (existingIndex > -1) {
                        const updated = [...prevCart];
                        updated[existingIndex].quantity += quantity;
                        return updated;
                    } else {
                        return [...prevCart, { product, quantity }];
                    }
                });
                showToast(`Added "${product.name}" to cart!`);
            };

            const updateCartQuantity = (productId, delta) => {
                setCart(prevCart => {
                    return prevCart.map(item => {
                        if (item.product.id === productId) {
                            const newQty = item.quantity + delta;
                            return newQty > 0 ? { ...item, quantity: newQty } : null;
                        }
                        return item;
                    }).filter(Boolean);
                });
            };

            const removeFromCart = (productId) => {
                setCart(prevCart => prevCart.filter(item => item.product.id !== productId));
                showToast("Item removed from cart");
            };

            const toggleWishlist = (product) => {
                setWishlist(prev => {
                    const exists = prev.some(item => item.id === product.id);
                    if (exists) {
                        showToast("Removed from Wishlist");
                        return prev.filter(item => item.id !== product.id);
                    } else {
                        showToast("Saved to Wishlist!");
                        return [...prev, product];
                    }
                });
            };

                return cart.reduce((total, item) => {
                    const price = item.product.salePrice || item.product.price;
                    return total + (price * item.quantity);
                }, 0);
            }, [cart]);

            const generateWhatsAppCartUrl = () => {
                if (cart.length === 0) return '#';
                
                let message = `Hello Kathgolap! I would like to place an order from your website.\n\n*ORDER ITEMS:*\n`;
                
                cart.forEach((item, index) => {
                    const effectivePrice = item.product.salePrice || item.product.price;

                });

                message += `\n*Subtotal:* ₹${cartSubtotal.toLocaleString('en-IN')}`;
                message += `\n*Delivery Note:* Standard express shipping charges apply based on delivery location.`;
                message += `\n\nPlease confirm product availability, shipping charges to my address, and payment options. Thank you!`;

                const cleanNumber = settings.whatsappNumber.replace(/[^0-9]/g, '');
                return `https://wa.me/${cleanNumber}?text=${encodeURIComponent(message)}`;
            };

            const generateSingleProductWhatsAppUrl = (product, quantity = 1) => {
                const effectivePrice = product.salePrice || product.price;
                const total = effectivePrice * quantity;
                
                let message = `Hello Kathgolap! I would like to inquire/order this saree directly:\n\n`;
                message += `🌸 *Saree Name:* ${product.name}\n`;
                message += `🏷️ *Product Code / SKU:* ${product.sku}\n`;

                message += `💰 *Price:* ₹${effectivePrice.toLocaleString('en-IN')}\n`;

                    message += `💳 *Total Amount:* ₹${total.toLocaleString('en-IN')}\n`;

                         selectedCategory === 'Bestsellers' ? p.isBestseller :
                         p.category === selectedCategory);

                                    <a href={`https://wa.me/${settings.whatsappNumber.replace(/[^0-9]/g, '')}`} target="_blank" rel="noreferrer"><i className="fa-brands fa-whatsapp text-base"></i></a>
                                </div>
                            </div>

                            <div>
                                <h5 className="font-serif font-bold text-sm text-gold-400 uppercase tracking-wider mb-3">Collections</h5>
                                <ul className="space-y-2 text-xs text-ivory-200">
                                    {categories.slice(0, 5).map((cat, i) => (
                                        <li key={i}>
                                            <button onClick={() => { setSelectedCategory(cat); setActiveTab('shop'); }} className="hover:text-gold-300 transition">
                                                {cat}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div>
                                <h5 className="font-serif font-bold text-sm text-gold-400 uppercase tracking-wider mb-3">Boutique Service</h5>
                                <ul className="space-y-2 text-xs text-ivory-200">
                                    <li><button onClick={() => setActiveTab('about')} className="hover:text-gold-300">About Our Heritage</button></li>
                                    <li><button onClick={() => setActiveTab('contact')} className="hover:text-gold-300">Contact & Support</button></li>
                                    <li><button onClick={() => showToast(settings.shippingNotice)} className="hover:text-gold-300">Shipping Policy</button></li>
                                </ul>
                            </div>

                            <div>
                                <h5 className="font-serif font-bold text-sm text-gold-400 uppercase tracking-wider mb-3">WhatsApp Order Line</h5>
                                <p className="text-xs text-ivory-200 mb-2">Need direct assistance or draping guidance?</p>
                                <a 
                                    href={`https://wa.me/${settings.whatsappNumber.replace(/[^0-9]/g, '')}`}
                                    target="_blank"
                                    rel="noreferrer"
                                    className="inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition"
                                >
                                    <i className="fa-brands fa-whatsapp text-sm"></i>
                                    <span>{settings.whatsappNumber}</span>
                                </a>
                            </div>

                        </div>

                        <div className="max-w-7xl mx-auto px-4 mt-8 pt-6 border-t border-botanical-900 flex flex-col sm:flex-row items-center justify-between text-[11px] text-gray-400">
                            <p>© {new Date().getFullYear()} {settings.storeTitle} Boutique. All Rights Reserved. Grace in Every Thread.</p>
                            <button onClick={() => setIsAdminOpen(true)} className="hover:text-gold-400 mt-2 sm:mt-0 transition">
                                🔑 Admin Management Portal
                            </button>
                        </div>
                    </footer>
                </div>
            );
        }

        // Render Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
